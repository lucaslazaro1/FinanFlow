<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark obsidian canvas gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Subtle ambient emerald radial glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Modern fintech neon flow gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Metallic card highlight gradient -->
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- iOS squircle base background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  
  <!-- Subtle border definition -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>

  <!-- Ambient fintech illumination circle -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- Minimalist Geometric Fintech Emblem (Stylized Wallet & Financial Flow Node) -->
  <g transform="translate(106, 116)" filter="url(#subtleShadow)">
    <!-- Back card / ledger facet (angled card geometry) -->
    <rect x="20" y="30" width="220" height="140" rx="28" fill="url(#facetGrad)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="4"/>
    <line x1="48" y1="70" x2="120" y2="70" stroke="rgba(255, 255, 255, 0.4)" stroke-width="6" stroke-linecap="round"/>
    <line x1="48" y1="94" x2="90" y2="94" stroke="rgba(255, 255, 255, 0.25)" stroke-width="5" stroke-linecap="round"/>

    <!-- Primary Neon Origami Card & Flow (Interlocking dynamic node) -->
    <path 
      d="M 40 100 C 40 76 56 60 80 60 L 230 60 C 254 60 270 76 270 100 L 270 200 C 270 224 254 240 230 240 L 80 240 C 56 240 40 224 40 200 Z" 
      fill="url(#flowGrad)"
    />

    <!-- Precision cutout & financial flow delta -->
    <path 
      d="M 80 100 L 180 100 C 190 100 200 110 200 120 C 200 130 190 140 180 140 L 100 140 L 150 200 L 110 200 Z" 
      fill="#0b1120" 
      fill-opacity="0.92"
    />

    <!-- Core node balance dot -->
    <circle cx="215" cy="120" r="14" fill="#ffffff" />
    <circle cx="215" cy="120" r="7" fill="#10b981" />
  </g>
</svg>
